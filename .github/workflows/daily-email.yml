name: daily-email

on:
  schedule:
    - cron: '47 1 * * *'   # 01:47 UTC = 07:17 IST (Learn target 07:30-08:00 AM)
    - cron: '47 9 * * *'   # 09:47 UTC = 15:17 IST (Quiz target 03:30-04:00 PM)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Email mode (learn or quiz)'
        required: false
        default: 'learn'
        type: choice
        options:
          - learn
          - quiz

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore user.db from git
        run: git show HEAD:data/user.db > data/user.db 2>/dev/null || echo "no prior db, will create fresh"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Send learn or quiz based on trigger
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python agent/send_daily.py --mode "${{ inputs.mode || 'learn' }}"
          elif [ "${{ github.event.schedule }}" = "47 1 * * *" ]; then
            python agent/send_daily.py --mode learn
          else
            python agent/send_daily.py --mode quiz
          fi
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Commit metadata updates
        run: |
          git config user.name "scholar-loop-bot"
          git config user.email "bot@scholar-loop.local"
          git add data/user.db
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "chore: update review metadata [skip ci]" && git push; fi

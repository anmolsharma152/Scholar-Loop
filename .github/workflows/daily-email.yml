name: daily-email

on:
  schedule:
    # 01:47 UTC = 07:17 IST, Monday-Friday only. One combined Learn + Quiz email.
    # GitHub's scheduler often runs late; target inbox time is ~07:45-08:15 IST.
    - cron: '47 1 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Email mode'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - learn
          - quiz

permissions:
  contents: write

concurrency:
  group: daily-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Restore user.db from git
        run: git show HEAD:data/user.db > data/user.db 2>/dev/null || echo "no prior db, will create fresh"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send Scholar-Loop email
        run: python agent/send_daily.py --mode "${{ inputs.mode || 'daily' }}"
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit metadata updates
        run: |
          git config user.name "scholar-loop-bot"
          git config user.email "bot@scholar-loop.local"
          git add data/user.db
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "chore: update review metadata [skip ci]" && git push; fi

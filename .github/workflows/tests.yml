name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/user.db'
      - 'knowledge/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q
